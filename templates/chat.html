<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">

<title>Gemma AI Chat</title>

<style>

body{
    background:#111;
    color:white;
    font-family:Arial;
}

#container{
    width:900px;
    margin:auto;
    margin-top:20px;
}

#status{
    padding:10px;
    margin-bottom:15px;
    border-radius:5px;
    font-weight:bold;
}

.good{
    background:#0d652d;
}

.bad{
    background:#7a1616;
}

#chatbox{
    height:500px;
    overflow-y:auto;
    border:1px solid #444;
    padding:10px;
}

.user{
    color:#7CFC00;
    margin-top:10px;
}

.bot{
    color:#00BFFF;
    margin-top:10px;
}

input{
    width:80%;
    padding:12px;
}

button{
    padding:12px;
    cursor:pointer;
}

</style>

</head>

<body>

<div id="container">

<h2>🤖 Gemma AI Chat</h2>

<div id="status">
Loading status...
</div>

<div id="chatbox"></div>

<br>

<input
    id="msg"
    placeholder="Type message..."
    onkeydown="if(event.key==='Enter') sendMessage()"
/>

<button onclick="sendMessage()">
Send
</button>

</div>

<script>

async function checkStatus(){

    try{

        let res = await fetch('/status');
        let data = await res.json();

        let div = document.getElementById("status");

        if(data.running && data.installed){

            div.className = "good";

            div.innerHTML =
                "✅ Ollama Running<br>" +
                "✅ Model Installed<br>" +
                "Model: gemma4:31b";

        }
        else if(data.running){

            div.className = "bad";

            div.innerHTML =
                "⚠️ Ollama Running<br>" +
                "❌ Model Missing";

        }
        else{

            div.className = "bad";

            div.innerHTML =
                "❌ Ollama Not Running";

        }

    }
    catch(err){

        document.getElementById("status").innerHTML =
            "❌ Cannot connect to Flask";

    }

}

async function sendMessage(){

    let input = document.getElementById("msg");

    let msg = input.value.trim();

    if(msg === "")
        return;

    input.value = "";

    let box = document.getElementById("chatbox");

    box.innerHTML +=
        `<div class="user"><b>You:</b> ${msg}</div>`;

    box.scrollTop = box.scrollHeight;

    let res = await fetch("/api/chat",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body:JSON.stringify({
            message:msg
        })
    });

    let data = await res.json();

    box.innerHTML +=
        `<div class="bot"><b>Gemma:</b> ${data.reply}</div>`;

    box.scrollTop = box.scrollHeight;

}

checkStatus();

setInterval(checkStatus,5000);

</script>

</body>
</html>
